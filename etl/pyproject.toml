[project]
name = "etl"
version = "0.1.0"
description = "Archival and normalization pipeline for the Votus electoral analysis platform."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.3.6",
    "pypdf==6.14.2",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "shapely==2.1.2",
]

[project.scripts]
etl-verify = "etl.verify:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
]
build = ["hatchling==1.32.4", "editables==0.6"]

[tool.uv]
required-version = "==0.12.19"
default-groups = ["dev", "build"]
no-build-isolation-package = ["etl"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "../spikes/scripts"]
markers = ["owned_database: trusted administrative fixtures on a verified disposable target"]
