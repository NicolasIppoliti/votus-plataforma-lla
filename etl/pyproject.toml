[project]
name = "etl"
version = "0.1.0"
description = "Archival and normalization pipeline for the Votus electoral analysis platform."
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "shapely>=2.0,<3",
]

[project.scripts]
etl-verify = "etl.verify:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests", "../spikes/scripts"]
markers = ["owned_database: trusted administrative fixtures on a verified disposable target"]
