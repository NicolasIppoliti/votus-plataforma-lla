# Internal LLA fiscalización spreadsheet (design D9). `source_kind:
# fiscalizacion` distinguishes it from every entry above; the repository
# excludes fiscalización rows from every query by default (D9.1). The
# spreadsheet is supplied by the user OUTSIDE this repository (no committed
# source_url path -- `local` is a marker, not a fetchable URL) and is
# archived to the LOCAL mirror only -- `upload: never` is a hard contract
# enforced by etl.ingest.fiscalizacion.guard_local_mirror_only, never a
# shared bucket. `Nombre`/`Apellido` are stripped at ingestion (D9.3) before
# any row is parsed; only `Escuela` (an establecimiento label, not personal
# data) and `source_row_index` survive for review-queue lineage.
fiscalizacion:
  - id: fiscalizacion/2025-coronel-rosales
    election_year: 2025
    election_round: legislativas
    source: local-file
    source_url: local://fiscalizacion/2025-coronel-rosales-mesas-procesadas.csv
    mime: text/csv
    source_kind: fiscalizacion
    upload: never
    notes: >-
      Internal LLA party fiscalización tally, hand-maintained spreadsheet,
      26 Oct 2025 national legislative election, Coronel Rosales distrito
      027. 105 raw rows -> merge wrapped continuations -> 99 -> collapse
      identical duplicates -> 93 unique mesas, 20797 total votes (verified,
      etl/tests/fixtures/fiscalizacion_2025_stripped_sample.csv). Coverage
      93/153 mesas is NOT missing at random (D9.2) -- the uncovered set is
      exactly where LLA had no fiscal present.
    filename: fiscalizacion-2025-coronel-rosales.csv
