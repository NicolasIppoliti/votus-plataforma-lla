# Registered source URLs for the archival pipeline (etl.archive).
#
# Schema per entry (matches etl.archive.archive_source's expected shape):
#   - id: <stable slug, referenced by archive-manifest.json>
#     source: <host label>
#     source_url: <https://... official URL>
#     mime: <application/zip | text/csv | application/json | application/pdf>
#     notes: <free text, e.g. size, verification date, known caveats>
#     filename: <optional explicit local filename; defaults to id's last
#       segment>
#
# Per design D10 / task 2.8: PBA entries (host www.juntaelectoral.gba.gov.ar)
# were added only after Phase 5's product-owner policy gate cleared (Engram
# #1412) and task 5.0's path discovery (spikes/002-pba-2025-paths.md).
# Every "pba" entry below carries D10's eight etiquette constraints: host
# pinned to `www` with TLS verification on (never bypassed); concurrency 1;
# >=4s delay via etl.archive.POLITENESS_DELAY_SECONDS["pba"]; the identifying
# User-Agent (etl.http_client.DEFAULT_USER_AGENT); archive-first caching
# (etl.ingest.pba.archive_pba_source never re-fetches an existing "ok"
# record); bounded retry (3 attempts) then stop on 429/5xx
# (etl.ingest.pba.PbaFetchExhaustedError); registered paths only, no
# crawling (etl.ingest.pba.PBA_ALLOWED_PATHS is the same allowlist bound to
# these entries' source_urls); and a halt-and-escalate re-check on every run
# if robots.txt ever starts returning 200
# (etl.http_client.check_robots_txt_still_absent). See design.md D10.

