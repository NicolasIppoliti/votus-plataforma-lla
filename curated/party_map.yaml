  - year: 2023
    jurisdiction: coronel_rosales_municipal
    category: CONCEJALES
    list_id: "135"
    canonical_party: LLA
    party_name: LA LIBERTAD AVANZA
    source: "https://www.juntaelectoral.gba.gov.ar/resultados-generales/2023027.pdf"
  - year: 2023
