  # 2023 municipal escrutinio document -- one-off fetch per D10, cached at
  # https://www.juntaelectoral.gba.gov.ar/resultados-generales/2023027.pdf
  # (HTTP 200, distrito 027 / SECCION SEXTA, TOTAL DE MESAS 153). It shows
  # the SAME numbers as the national 2023 agrupacion_id space for this
  # distrito -- LLA ran solo as list 135, confirming task 7.1's premise
  # rather than requiring correction.
