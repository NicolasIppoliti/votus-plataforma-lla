# curated/party_map.yaml
#
# Human-curated, PR-reviewed party-identity mapping (party-identity-mapping
# spec; task 7.6). Key is the FULL tuple
# (year, jurisdiction, category, list_id) -- list_id alone is NEVER a party
# key; the same list_id value under a different year/jurisdiction/category
# is an UNRELATED entry. Adding a mapping requires a reviewed PR, never
# inferred automatically from list names or numbers at query/ingest time.
#
# MEASURED, CATEGORY-DEPENDENT IDENTIFIER SCHEMES (Engram #1417):
#   1. National `agrupacion_id` is NOT a stable cross-year party key -- LLA
#      moved 135 (2023 PASO) -> 110 (2025 legislativas) in this same
#      distrito. Never resolve across years by agrupacion_id alone.
#   2. Identifier shape and `lista_numero` population depend on the election
#      round AND category. In distrito 2 of the 2023 generales archive,
#      PRESIDENTE Y VICE uses three-digit agrupacion_id values 132--136 with
#      empty `lista_numero`, while DIPUTADO NACIONAL uses the five-digit 201xx
#      agrupacion_id family. The 2023 balotaje PRESIDENTE Y VICE rows likewise
#      use 134/135 with empty `lista_numero`; the observed 2025 DIPUTADO
#      NACIONAL rows also use empty `lista_numero`. The key below is `list_id`
#      (== agrupacion_id), never `lista_numero`.
#   3. PBA municipal's 22xx list family (jurisdiction:
#      coronel_rosales_municipal) is a separate numbering scheme from the
#      national agrupacion_id space (jurisdiction: national), even where
#      numeric values coincide.
#
# Numeric recurrence across categories or jurisdictions is source evidence,
# not a global identifier scheme. The full (year, jurisdiction, category,
# list_id) key keeps 2023's three-digit national PRESIDENTE identities,
# five-digit national DIPUTADO identities, and municipal identities distinct.

# Canonical parents are declared explicitly. Their display labels are public
# presentation data and never inferred from the source-observed spellings in
# `mappings[].party_name` below.
