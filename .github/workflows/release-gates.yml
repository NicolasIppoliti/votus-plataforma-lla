name: Release gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scope:
    name: scope
    outputs:
      gates: ${{ steps.publish.outputs.gates }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          scope_json=$(
          if [ "${{ github.event_name }}" = "push" ]; then
            node --experimental-strip-types apps/web/scripts/ci-path-scope.ts --all
          else
            node --experimental-strip-types apps/web/scripts/ci-path-scope.ts \
              --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          fi
          )
          printf '%s\n' "$scope_json"
          printf 'json=%s\n' "$scope_json" >> "$GITHUB_OUTPUT"
      - name: Publish scope gates
        id: publish
        shell: bash
        env:
          SCOPE_JSON: ${{ steps.classify.outputs.json }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require('node:fs');
          const scope = JSON.parse(process.env.SCOPE_JSON);
          const choices = new Map([
            ['all', ['web-static', 'etl-release', 'e2e-release']],
            ['etl-only', ['etl-release']],
            ['web-and-e2e', ['web-static', 'e2e-release']],
          ]);
          const gates = choices.get(scope?.decision);
          if (scope?.schemaVersion !== 1 || !gates ||
              JSON.stringify(scope.gates) !== JSON.stringify(gates)) {
            throw new Error('Invalid scope contract');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `gates=${JSON.stringify(gates)}\n`);
          NODE

  web-static:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'web-static') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12.3.4
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - name: Typecheck with TypeScript 7.x
        run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web

  etl-release:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'etl-release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [ordinary, success, ledger, sql]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.8.8"
          enable-cache: true
      - name: Ruff lint
        run: uv run --project . --frozen ruff check .
        working-directory: etl
      - name: Ruff format check
        run: uv run --project . --frozen ruff format --check .
        working-directory: etl
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.116.0
      - name: Run disposable ETL gate
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ETL_CASE: ${{ matrix.case }}
          ETL_TEST_ADMIN_DATABASE_URL: >-
            postgresql://postgres@127.0.0.1:54322/template1
        run: |
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d template1 -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; \
            create role etl_writer login bypassrls password null; \
            grant etl_writer to postgres;"
          if [ "$ETL_CASE" = "ordinary" ]; then
            uv run --project etl etl-verify
          else
            uv run --project etl etl-verify --migration-atomicity "$ETL_CASE"
          fi

  e2e-release:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'e2e-release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12.3.4
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.112.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm test:e2e:gate --lane browser
        working-directory: apps/web
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ failure() }}
        with:
          name: review-focus-geometry
          path: apps/web/test-results/**/review-focus-geometry.json
          retention-days: 1
          include-hidden-files: false
          if-no-files-found: ignore

  e2e-sql:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'e2e-release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 12.3.4
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.112.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm test:e2e:gate --lane sql
        working-directory: apps/web

  verify:
    name: verify
    needs:
      - scope
      - web-static
      - etl-release
      - e2e-release
      - e2e-sql
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      SCOPE_GATES: ${{ needs.scope.outputs.gates }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      WEB_STATIC_RESULT: ${{ needs.web-static.result }}
      ETL_RELEASE_RESULT: ${{ needs.etl-release.result }}
      E2E_RELEASE_RESULT: ${{ needs.e2e-release.result }}
      E2E_SQL_RESULT: ${{ needs.e2e-sql.result }}
    steps:
      - name: Require all release gates
        shell: bash
        run: |
          test "$SCOPE_RESULT" = "success"
          case "$SCOPE_GATES" in
            '["web-static","etl-release","e2e-release"]')
              web=success; etl=success; e2e=success ;;
            '["etl-release"]')
              web=skipped; etl=success; e2e=skipped ;;
            '["web-static","e2e-release"]')
              web=success; etl=skipped; e2e=success ;;
            *) echo "Invalid scope gates" >&2; exit 1 ;;
          esac
          test "$WEB_STATIC_RESULT" = "$web"
          test "$ETL_RELEASE_RESULT" = "$etl"
          test "$E2E_RELEASE_RESULT" = "$e2e"
          test "$E2E_SQL_RESULT" = "$e2e"
