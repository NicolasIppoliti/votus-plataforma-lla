name: Release gates
on:
  pull_request:
  push:
    branches: [main, develop]
# A newer commit supersedes an in-flight run on the same pull request or on
# develop. Each main commit gets its own group, so a main run is never
# cancelled nor replaced while pending, and every main commit keeps its verdict.
concurrency:
  group: release-gates-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
env:
  # Supabase CLI pulls its local-stack images from GHCR instead of ECR Public,
  # whose anonymous data limit is exhausted on shared runners.
  SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
jobs:
  scope:
    name: scope
    outputs:
      gates: ${{ steps.publish.outputs.gates }}
      supabase: ${{ steps.publish.outputs.supabase }}
      python: ${{ steps.publish.outputs.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          fetch-depth: 0
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Classify changed paths
        id: classify
        shell: bash
        run: |
          scope_json=$(
          if [ "${{ github.event_name }}" = "push" ]; then
            node --experimental-strip-types apps/web/scripts/ci-path-scope.ts --all
          else
            node --experimental-strip-types apps/web/scripts/ci-path-scope.ts \
              --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.sha }}"
          fi
          )
          printf '%s\n' "$scope_json"
          printf 'json=%s\n' "$scope_json" >> "$GITHUB_OUTPUT"
      - name: Publish scope gates
        id: publish
        shell: bash
        env:
          SCOPE_JSON: ${{ steps.classify.outputs.json }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const scope = JSON.parse(process.env.SCOPE_JSON);
          const choices = new Map([
            ['all', ['web-static', 'etl-release', 'e2e-release']],
            ['etl-only', ['etl-release']],
            ['web-and-e2e', ['web-static', 'e2e-release']],
          ]);
          const fullGates = choices.get(scope?.decision);
          if (scope?.schemaVersion !== 1 || !fullGates ||
              JSON.stringify(scope.gates) !== JSON.stringify(fullGates)) {
            throw new Error('Invalid scope contract');
          }
          // Pull requests into the develop integration branch skip the browser
          // and SQL release lanes; develop pushes and PRs into main run them.
          const gates = process.env.BASE_REF === 'develop'
            ? fullGates.filter(gate => gate !== 'e2e-release')
            : fullGates;
          const supabase = JSON.parse(readFileSync('apps/web/package.json', 'utf8')).devDependencies?.supabase;
          const python = readFileSync('.python-version', 'utf8').trim();
          if ([supabase, python].some(value => typeof value !== 'string' || !/^\d+\.\d+\.\d+$/.test(value))) {
            throw new Error('Toolchain versions must be exact releases');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,
            `gates=${JSON.stringify(gates)}\nsupabase=${supabase}\npython=${python}\n`);
          NODE

  web-static:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'web-static') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: apps/web/package.json
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - name: Typecheck with TypeScript 7.x
        run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web

  etl-release:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'etl-release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        case: [ordinary, success, ledger, sql]
    services:
      postgres:
        # Same digest from Google's Docker Hub mirror; avoids the unauthenticated
        # Docker Hub and ECR Public pull limits on shared runners.
        image: mirror.gcr.io/library/postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v7.6.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version-file: etl/pyproject.toml
          python-version: ${{ needs.scope.outputs.python }}
          enable-cache: true
      - name: Ruff lint
        run: uv run --project . --locked ruff check .
        working-directory: etl
      - name: Ruff format check
        run: uv run --project . --locked ruff format --check .
        working-directory: etl
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: ${{ needs.scope.outputs.supabase }}
      - name: Run disposable ETL gate
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ETL_CASE: ${{ matrix.case }}
          ETL_TEST_ADMIN_DATABASE_URL: >-
            postgresql://postgres@127.0.0.1:54322/template1
        run: |
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d template1 -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; \
            create role etl_writer login bypassrls password null; \
            grant etl_writer to postgres;"
          if [ "$ETL_CASE" = "ordinary" ]; then
            uv run --project etl --locked etl-verify
          else
            uv run --project etl --locked etl-verify --migration-atomicity "$ETL_CASE"
          fi

  e2e-release:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'e2e-release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: apps/web/package.json
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: ${{ needs.scope.outputs.supabase }}
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm evaluate:territorial-renderer -- --verify
        working-directory: apps/web
      - name: Generate portable prototype prerequisites
        run: |
          python3 -m pip install shapely==2.1.2
          node docs/prototypes/territorial-exploration/generate-reference-assets.mjs
          node docs/prototypes/territorial-exploration/generate-winner-reference-assets.mjs
          node docs/prototypes/seat-simulation/build.mjs
      - run: pnpm test:e2e:gate --lane browser
        working-directory: apps/web
      # v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ failure() }}
        with:
          name: review-focus-geometry
          path: |
            apps/web/test-results/**/review-focus-geometry.json
            apps/web/test-results/**/review-scroll-completion.json
            apps/web/test-results/**/simulate-back-restore.json
            apps/web/test-results/**/e2e-facts-*.json
          retention-days: 1
          include-hidden-files: false
          if-no-files-found: ignore

      # v7.0.1 — synthetic mobile audit evidence only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: mobile-evidence-463
          path: apps/web/test-results/**/e2e-evidence-463-*.png
          retention-days: 14
          if-no-files-found: ignore

      # v7.0.1 — opt-in synthetic R5 captures, not global screenshots
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: visual-evidence-r5
          path: |
            apps/web/test-results/**/prototype-*-*.png
            apps/web/test-results/**/production-*-*.png
            apps/web/test-results/**/pair-*-*.png
            apps/web/test-results/**/visual-evidence-r5-heights.json
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: false

  e2e-cross-browser:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'e2e-release') && ((github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: apps/web/package.json
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: ${{ needs.scope.outputs.supabase }}
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps firefox webkit
        working-directory: apps/web
      - run: pnpm test:e2e:gate --lane cross-browser
        working-directory: apps/web
      # v7.0.1 — bounded counts only, including both engine outcomes
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: cross-browser-counts
          path: apps/web/test-results/e2e-facts-cross-browser.json
          retention-days: 14
          if-no-files-found: warn

  e2e-sql:
    needs: scope
    if: ${{ !cancelled() && needs.scope.result == 'success' && contains(fromJSON(needs.scope.outputs.gates || '[]'), 'e2e-release') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # v5.1.0
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          package_json_file: apps/web/package.json
      # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # v2.1.1
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: ${{ needs.scope.outputs.supabase }}
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm test:e2e:gate --lane sql
        working-directory: apps/web

  verify:
    name: verify
    needs:
      - scope
      - web-static
      - etl-release
      - e2e-release
      - e2e-sql
      - e2e-cross-browser
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      SCOPE_GATES: ${{ needs.scope.outputs.gates }}
      SCOPE_RESULT: ${{ needs.scope.result }}
      WEB_STATIC_RESULT: ${{ needs.web-static.result }}
      ETL_RELEASE_RESULT: ${{ needs.etl-release.result }}
      E2E_RELEASE_RESULT: ${{ needs.e2e-release.result }}
      E2E_SQL_RESULT: ${{ needs.e2e-sql.result }}
      E2E_CROSS_BROWSER_RESULT: ${{ needs.e2e-cross-browser.result }}
      CROSS_BROWSER_EVENT: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/develop') || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Require all release gates
        shell: bash
        run: |
          test "$SCOPE_RESULT" = "success"
          if [ "$BASE_REF" = "develop" ]; then
            case "$SCOPE_GATES" in
              '["web-static","etl-release"]')
                web=success; etl=success; e2e=skipped ;;
              '["etl-release"]')
                web=skipped; etl=success; e2e=skipped ;;
              '["web-static"]')
                web=success; etl=skipped; e2e=skipped ;;
              *) echo "Invalid scope gates" >&2; exit 1 ;;
            esac
          else
            case "$SCOPE_GATES" in
              '["web-static","etl-release","e2e-release"]')
                web=success; etl=success; e2e=success ;;
              '["etl-release"]')
                web=skipped; etl=success; e2e=skipped ;;
              '["web-static","e2e-release"]')
                web=success; etl=skipped; e2e=success ;;
              *) echo "Invalid scope gates" >&2; exit 1 ;;
            esac
          fi
          test "$WEB_STATIC_RESULT" = "$web"
          test "$ETL_RELEASE_RESULT" = "$etl"
          test "$E2E_RELEASE_RESULT" = "$e2e"
          test "$E2E_SQL_RESULT" = "$e2e"
          cross_browser=skipped
          if [ "$CROSS_BROWSER_EVENT" = "true" ] && [ "$e2e" = "success" ]; then
            cross_browser=success
          fi
          test "$E2E_CROSS_BROWSER_RESULT" = "$cross_browser"
