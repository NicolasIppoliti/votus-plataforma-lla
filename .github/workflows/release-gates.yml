name: Release gates
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320
        with:
          version: 10.32.1
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # v6.8.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: "0.8.8"
          enable-cache: true
      # v1.7.1
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.112.0
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: pnpm lint
        working-directory: apps/web
      - name: Typecheck with TypeScript 7.x
        run: pnpm typecheck
        working-directory: apps/web
      - run: pnpm test
        working-directory: apps/web
      - name: Ruff lint
        run: uv run --project . --frozen ruff check .
        working-directory: etl
      - name: Ruff format check
        run: uv run --project . --frozen ruff format --check .
        working-directory: etl
      - name: Run disposable ETL gate
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          ETL_TEST_ADMIN_DATABASE_URL: >-
            postgresql://postgres@127.0.0.1:54322/template1
        run: |
          docker exec "$POSTGRES_CONTAINER" \
            psql -U postgres -d template1 -v ON_ERROR_STOP=1 -c \
            "create role anon nologin; create role authenticated nologin; \
            create role etl_writer login bypassrls password null; \
            grant etl_writer to postgres;"
          uv run --project etl etl-verify
      - run: pnpm build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
      - run: pnpm test:e2e:gate
        working-directory: apps/web
